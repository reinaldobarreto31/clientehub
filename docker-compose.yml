version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: clientehub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clientehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clientehub-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/clientehub
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: "ch-dev-secret-key-must-be-at-least-32-chars-long"
      JWT_EXPIRATION_MS: "86400000"
      PORT: "8080"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clientehub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
